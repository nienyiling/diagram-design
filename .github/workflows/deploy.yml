name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - claude/cloudflare-diagram-design-tool-jslcim   # 開發分支，合併後可刪這行
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PROJECT: diagram-design   # Cloudflare Pages 專案名，撞名時會自動加後綴

jobs:
  test:
    name: 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 這一關同時會重跑 scripts/build-data.mjs 並跟 commit 進來的 data/diagrams.json 比對，
      # 有人改了轉換規則卻忘了 npm run build 就會在這裡紅。
      - name: 純函式與資料一致性
        run: npm run test:unit

      # e2e 是唯一擋得住「資料檔壞掉、有幾張圖畫不出來」的關卡：
      # 首頁看起來完全正常，要等使用者點進那一張才會發現。
      - name: 安裝 Chromium
        run: |
          npm i -g playwright@1
          npx playwright install --with-deps chromium

      - name: 瀏覽器實測
        run: npm run test:e2e

  deploy:
    name: 部署
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 部署有兩條路，二選一：
      #   (a) 這支 workflow：要設 repo secret（CLOUDFLARE_API_TOKEN／ACCOUNT_ID）
      #   (b) Cloudflare 後台的 Git 整合：不必 secret，Cloudflare 自己拉 repo 建置
      # 走 (b) 的話這支就沒有憑證可用。這時**跳過而不是失敗**——
      # 每次推 main 都亮一個紅叉，久了就沒人看 Actions 了。
      - name: 檢查部署憑證
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "憑證齊備，這支 workflow 會負責部署。"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### 這支 workflow 沒有部署（缺 Cloudflare 憑證）"
              echo ""
              echo "測試已經跑完並通過。目前沒有設 \`CLOUDFLARE_API_TOKEN\`／\`CLOUDFLARE_ACCOUNT_ID\`，"
              echo "所以部署那幾步跳過了。這是**正常的**，如果你是用 Cloudflare 後台的 Git 整合部署。"
              echo ""
              echo "要改成由 Actions 部署，到 Settings → Secrets and variables → Actions 補上這兩個 secret；"
              echo "取得方式見 README 的「部署」段。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::沒有 Cloudflare 憑證，跳過部署（走 Cloudflare 後台 Git 整合的話這是正常的）"
          fi

      # 組出 dist 與「缺檔就失敗」的檢查都在 scripts/dist.mjs，
      # 跟 Cloudflare 後台 Git 整合那條路共用同一份清單——
      # 兩邊各寫一份的話，遲早會一邊上線、另一邊少檔案。
      - name: 組出部署目錄
        run: npm run dist

      # 首次執行時 Pages 專案還不存在，先建立；已存在則視為成功
      #
      # production branch 寫死 main，不要用 github 的 default_branch：
      # 專案的 production branch 只在「建立當下」決定，之後只能到 Cloudflare 後台改。
      # 若第一次跑的時候 repo 預設分支還是 claude/xxx，正式網址就會永遠掛在那個分支名下，
      # 之後推 main 全部變成 preview 部署——這種錯很難發現，也很難修。
      - name: 確保 Pages 專案存在
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          out=$(npx --yes wrangler@3 pages project create "$CF_PROJECT" \
                  --production-branch main 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "$out" | grep -qiE 'already exists|already have a project|8000007' \
              || { echo "::error::建立 Pages 專案失敗"; exit $code; }
            echo "專案已存在，略過建立。"
          fi

      - name: wrangler pages deploy
        if: steps.creds.outputs.ok == 'true'
        id: cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.CF_PROJECT }}
            --branch=${{ github.ref_name }}
            --commit-dirty=true

      # 網址一律取自 wrangler 輸出，不要寫死：Pages 子網域全球唯一，
      # 名稱被占用時 Cloudflare 會自動加後綴（dayoff → dayoff-ala.pages.dev 就是這樣來的）
      - name: 摘要
        if: steps.creds.outputs.ok == 'true'
        env:
          DEPLOY_URL: ${{ steps.cf.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.cf.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### Cloudflare Pages 部署完成"
            echo ""
            echo "- 分支：\`${{ github.ref_name }}\`"
            echo "- 本次部署網址：${DEPLOY_URL:-（未取得）}"
            echo "- 分支／正式網址：${ALIAS_URL:-（未取得）}"
            echo ""
            echo "驗收不要只看首頁開不開得起來：請點進一張範本，把字改成中文，"
            echo "然後真的下載一次 PNG，確認圖上是中文、下方有來源標註。"
          } >> "$GITHUB_STEP_SUMMARY"
